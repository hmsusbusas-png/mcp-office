[project]
name = "mcp-office"
version = "1.0.0"
description = "MCP server for Word, Excel and PowerPoint files with PDF export through Microsoft Office"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30,<2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pywin32>=306",
]

[project.scripts]
mcp-office = "officesrv.main:run"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/officesrv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs installed desktop software, a real server or internet"]
addopts = "-m 'not live'"
