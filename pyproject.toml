[project]
name = "officesrv"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "python-docx", "openpyxl", "pywin32"]

[project.scripts]
office-mcp = "officesrv.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/officesrv"]
